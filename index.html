<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunión - Información</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Lógica para cambiar modo oscuro/claro
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom-color: #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300">

    <!-- Botón Modo Oscuro -->
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleTheme()" class="p-2 bg-slate-200 dark:bg-slate-700 rounded-full shadow-lg text-sm">🌓</button>
    </div>

    <header class="bg-white dark:bg-slate-900 shadow-md pt-10 pb-6 px-4 text-center">
        <h1 class="text-3xl font-bold">Comunión</h1>
    </header>

    <nav class="bg-white dark:bg-slate-900 sticky top-0 z-40 shadow-sm flex justify-around border-b border-slate-200 dark:border-slate-800">
        <button onclick="showTab('inicio', this)" class="tab-btn active flex-1 py-4 text-lg font-semibold border-b-2">Inicio</button>
        <button onclick="showTab('ceremonia', this)" class="tab-btn flex-1 py-4 text-lg font-semibold border-b-2">Ceremonia</button>
        <button onclick="showTab('mesas', this)" class="tab-btn flex-1 py-4 text-lg font-semibold border-b-2">Mesas</button>
    </nav>

    <main class="max-w-xl mx-auto p-6 space-y-6">

        <div id="inicio" class="tab-content active space-y-4">
            <h2 class="text-2xl font-bold">¡Bienvenidos!</h2>
            <p class="text-lg leading-relaxed">Hemos creado esta web para que tengáis toda la información de mañana a mano.</p>
        </div>

        <div id="ceremonia" class="tab-content space-y-4">
            <h2 class="text-2xl font-bold">⛪ Ceremonia</h2>
            <p class="text-lg">Hora: 12:00 | Lugar: Parroquia San Ejemplo</p>
            <a href="https://maps.google.com/?q=Parroquia+de+San+Ejemplo+Zaragoza" class="block w-full py-4 bg-blue-600 text-white text-center rounded-xl font-bold text-lg">Cómo llegar (Google Maps)</a>
        </div>

        <div id="mesas" class="tab-content space-y-4">
            <h2 class="text-2xl font-bold">🪑 Mesas</h2>
            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 shadow-sm">
                <h3 class="text-xl font-bold text-blue-600">Mesa 1</h3>
                <p class="text-lg mt-2">Juan, Maria, Luis, Ana, Pedro, Elena, Sofia, Carlos</p>
            </div>
            <!-- Duplica este bloque div para otras mesas -->
        </div>

    </main>

    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
