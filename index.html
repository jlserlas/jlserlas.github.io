<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Menú Desplegable -->
    <nav class="bg-white dark:bg-slate-900 p-4 shadow-md sticky top-0 z-50">
        <div class="flex justify-between items-center">
            <h1 class="font-bold text-xl">Comunión</h1>
            <button onclick="document.getElementById('menu').classList.toggle('hidden')" class="text-2xl">☰</button>
            <button onclick="document.documentElement.classList.toggle('dark')" class="text-xl">🌓</button>
        </div>
        <div id="menu" class="hidden mt-4 flex flex-col gap-2">
            <button onclick="showTab('inicio')" class="py-3 text-left border-b">Inicio</button>
            <button onclick="showTab('ceremonia')" class="py-3 text-left border-b">Ceremonia</button>
            <button onclick="showTab('restaurante')" class="py-3 text-left border-b">Restaurante</button>
            <button onclick="showTab('mesas')" class="py-3 text-left border-b">Mesas</button>
        </div>
    </nav>

    <main class="p-6 max-w-xl mx-auto space-y-6">
        <div id="inicio" class="tab-content">
            <h2 class="text-2xl font-bold">Bienvenidos</h2>
            <p class="text-lg">Toda la info de la comunión aquí.</p>
        </div>

        <div id="ceremonia" class="tab-content hidden">
            <h2 class="text-2xl font-bold">⛪ Ceremonia</h2>
            <p class="text-lg mb-4">12:00 | Parroquia San Ejemplo</p>
            <a href="https://maps.google.com/?q=Parroquia+de+San+Ejemplo+Zaragoza" class="block w-full py-4 bg-blue-600 text-white text-center rounded-xl font-bold">Cómo llegar</a>
        </div>

        <div id="restaurante" class="tab-content hidden">
            <h2 class="text-2xl font-bold">🍽️ Restaurante</h2>
            <p class="text-lg mb-4">14:00 | Restaurante Celebraciones</p>
            <a href="https://maps.google.com/?q=Restaurante+Celebraciones+Zaragoza" class="block w-full py-4 bg-blue-600 text-white text-center rounded-xl font-bold">Cómo llegar</a>
        </div>

        <div id="mesas" class="tab-content hidden space-y-4">
            <h2 class="text-2xl font-bold">🪑 Mesas</h2>
            <div class="bg-white dark:bg-slate-900 p-4 border rounded-xl">
                <h3 class="font-bold text-blue-600">Mesa 1</h3>
                <p>Juan, Maria, Luis, Ana, Pedro, Elena, Sofia, Carlos</p>
            </div>
            <!-- Añade más mesas igual que arriba -->
        </div>
    </main>

    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('menu').classList.add('hidden');
        }
    </script>
</body>
</html>
