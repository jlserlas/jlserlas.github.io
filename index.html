<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunión - Información</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .overlay { display: none; }
        .overlay.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <!-- Header Fijo -->
    <header class="bg-white dark:bg-slate-900 shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
        <button onclick="toggleSidebar()" class="text-2xl p-2">☰</button>
        <button onclick="showTab('inicio')" class="font-bold text-xl">Comunión</button>
        <button onclick="document.documentElement.classList.toggle('dark')" class="text-2xl p-2">🌓</button>
    </header>

    <!-- Overlay (Capa para cerrar al clicar fuera) -->
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 overlay"></div>

    <!-- Sidebar Lateral -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white dark:bg-slate-900 shadow-2xl transform -translate-x-full transition-transform z-50 p-6">
        <button onclick="toggleSidebar()" class="mb-8 text-xl font-bold">✕ Cerrar</button>
        <div class="flex flex-col gap-6 text-lg font-semibold">
            <button onclick="showTab('inicio')" class="flex items-center gap-3">🏠 Inicio</button>
            <button onclick="showTab('ceremonia')" class="flex items-center gap-3">⛪ Ceremonia</button>
            <button onclick="showTab('restaurante')" class="flex items-center gap-3">🍽️ Restaurante</button>
            <button onclick="showTab('mesas')" class="flex items-center gap-3">🪑 Mesas</button>
            <button onclick="showTab('fiesta')" class="flex items-center gap-3">🎶 Fiesta</button>
        </div>
    </div>

    <main class="max-w-md mx-auto p-6 space-y-8">
        <!-- ... (Contenido igual que antes) ... -->
        <div id="inicio" class="tab-content block text-center space-y-6">
            <div class="text-6xl">🕊️</div>
            <h2 class="text-2xl font-bold">¡Bienvenidos!</h2>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="showTab('ceremonia')" class="w-full py-4 bg-white dark:bg-slate-900 border-2 border-blue-200 rounded-xl font-bold">⛪ Ceremonia</button>
                <button onclick="showTab('restaurante')" class="w-full py-4 bg-white dark:bg-slate-900 border-2 border-blue-200 rounded-xl font-bold">🍽️ Restaurante</button>
            </div>
        </div>
        <!-- ... (resto de tus pestañas) ... -->
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('active');
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            toggleSidebar(); // Cierra el menú y el overlay automáticamente
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
